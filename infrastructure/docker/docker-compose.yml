services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: process_automation
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional local AI platform: docker compose --profile ai-platform up.
  # These services bind only to localhost.
  litellm-db:
    image: postgres:16
    profiles: ["ai-platform"]
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env.ai-platform}
    volumes:
      - litellm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 15

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.8
    profiles: ["ai-platform"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env.ai-platform
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ai-platform"]
    depends_on:
      - litellm
    environment:
      WEBUI_AUTH: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:?Set a scoped LiteLLM virtual key in .env.ai-platform}
      ENABLE_OPENAI_API: "true"
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  postgres_data:
  litellm_data:
  open_webui_data:
