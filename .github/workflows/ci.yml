name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Verify pull-request preview never targets Production
        working-directory: frontend
        env:
          IS_PULL_REQUEST: "true"
          RENDER_EXTERNAL_HOSTNAME: "ai-process-automation-frontend-4bsh-pr-5.onrender.com"
        run: |
          npm run build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const runtimeConfig = readFileSync("src/runtime-config.js", "utf8");
            const previewApi = "https://ai-process-automation-backend-4bsh-pr-5.onrender.com";
            const productionApi = "https://ai-process-automation-backend-4bsh.onrender.com";
            if (!runtimeConfig.includes(previewApi)) {
              console.error("Expected Preview API URL was not generated:", runtimeConfig);
              process.exit(1);
            }
            if (runtimeConfig.includes(productionApi)) {
              console.error("PR Preview must never target the Production API:", runtimeConfig);
              process.exit(1);
            }
          '
